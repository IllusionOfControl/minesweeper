name: CI

on:
  push:
    branches: [master, cleanup]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.x'
          github-api-token: ${{ github.token }}

      - name: Verify CMake version
        run: cmake --version

      - name: Create vcpkg cache directory
        run: mkdir -p "${{ github.workspace }}/vcpkg-cache"
        shell: bash

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: ${{ matrix.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ matrix.os }}-vcpkg-

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libudev-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev libfreetype-dev libvorbis-dev libflac-dev

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Show vcpkg install log on configure failure (Windows)
        if: failure() && runner.os == 'Windows'
        run: |
          if (Test-Path build/vcpkg-manifest-install.log) {
            Get-Content build/vcpkg-manifest-install.log
          }
        shell: powershell

      - name: Show vcpkg install log on configure failure (Linux)
        if: failure() && runner.os == 'Linux'
        run: |
          if [ -f build/vcpkg-manifest-install.log ]; then
            cat build/vcpkg-manifest-install.log
          fi
        shell: bash

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure
